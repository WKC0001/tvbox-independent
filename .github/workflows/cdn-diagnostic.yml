name: diagnose-cdn-delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/cdn-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cdn-diagnostic
          path: cdn-diagnostic.json
