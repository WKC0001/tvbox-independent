name: maintenance-check
on:
  schedule:
    - cron: '7 */2 * * *'    # 每 2 小时轻检查
    - cron: '17 23 * * *'    # UTC 23:17 = 中国时间次日 07:17
    - cron: '17 19 * * 5'    # UTC 周五 19:17 = 中国时间周六 03:17
  workflow_dispatch:
    inputs:
      mode:
        description: light | full | weekly
        default: light
permissions:
  contents: write
concurrency:
  group: maintenance-independent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve mode
        id: m
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 */2 * * *" ]; then
            echo "mode=light" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 23 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          fi
      - name: Light check (release closure + route sample)
        if: steps.m.outputs.mode == 'light'
        run: python3 scripts/maintenance.py light
      - name: Full check (all live routes + health state machine)
        if: steps.m.outputs.mode == 'full'
        run: python3 scripts/maintenance.py full
      - name: Weekly review (full + gap report refresh)
        if: steps.m.outputs.mode == 'weekly'
        run: |
          python3 scripts/maintenance.py full
          # Candidate merge is a content-admission operation, not a health check.
      - name: Persist health state
        if: always()
        run: |
          git config user.name "maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/health.json reports/ || true
          git diff --cached --quiet || git commit -m "chore(maintenance): health state snapshot ${{ steps.m.outputs.mode }} [skip ci]"
          git push
      - name: Failure alert summary
        if: failure()
        run: |
          echo "::error::维护检查失败——请查看 reports/maintenance-*.json；若为批量异常(flag)请勿自动发布"
