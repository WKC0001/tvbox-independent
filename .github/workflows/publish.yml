name: publish-independent-npm
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Allocate a new patch version before building
        type: boolean
        default: false
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
permissions:
  contents: write
  # Opening the promotion run needs actions:write. Without it `automatic_latest`
  # would be a switch nobody reads — the same shape of dead gate this replaced.
  actions: write
concurrency:
  group: independent-release-state
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Allocate the next candidate version
        if: inputs.bump == true
        run: python scripts/release_version.py
      - name: Prepare pinned Android compiler tools
        run: |
          set -euo pipefail
          mkdir -p .build-tools
          python scripts/prepare_tools.py
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o .build-tools/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  .build-tools/json.jar' | sha256sum --check
          if [ ! -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
          fi
          echo "D8_JAR=$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar" >> "$GITHUB_ENV"
          echo "JSON_JAR=$GITHUB_WORKSPACE/.build-tools/json.jar" >> "$GITHUB_ENV"
          echo "SMALI_JAR=$GITHUB_WORKSPACE/.build-tools/smali-tools.jar" >> "$GITHUB_ENV"
      - name: Verify registry, build actual DEX, validate complete release
        run: python scripts/build_release.py
      - name: Pack clean npm stage
        run: npm pack ./npmstage --ignore-scripts
      - name: Publish fixed candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already exists on the registry; skipping npm publish so a re-run can finish verification."
          else
            npm publish "$NAME-$VERSION.tgz" --ignore-scripts --access public --tag next
          fi
      - name: Verify exact registry and CDN bytes
        run: node scripts/verify-cdn.cjs
      - name: Produce machine acceptance evidence for this version
        id: acceptance
        continue-on-error: true
        run: python scripts/auto_acceptance.py
      - name: Build the public landing page
        run: python -m pip install --quiet segno && python scripts/build_landing.py
      - name: Report whether this version may be promoted
        if: always()
        run: |
          if [ "${{ steps.acceptance.outcome }}" != "success" ]; then
            echo "::warning::This fixed version did not pass machine acceptance; latest must not be moved to it."
          else
            echo "Machine acceptance passed; latest may be promoted to this version."
          fi
      - name: Save exact published resources and derived evidence
        run: |
          git config user.name maintenance-bot
          git config user.email actions@users.noreply.github.com
          git add package.json output/api.json output/cfg.jpg output/live.m3u output/dc.json output/manifest.json \
                  reports/plugin-verification.json reports/build-dependencies.json \
                  reports/live-gaps.json reports/bench-sites.json reports/epg-gaps.json \
                  docs/index.html docs/qr-latest.svg
          if [ -d reports/acceptance ]; then git add reports/acceptance; fi
          git diff --cached --quiet || git commit -m 'chore: freeze verified candidate resources [skip ci]'
          git push
      - name: Promote automatically when policy allows it
        if: steps.acceptance.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ALLOW="$(python -c "import json;print(str(json.load(open('policy/operations.json'))['automatic_latest']).lower())")"
          if [ "$ALLOW" != "true" ]; then
            echo "automatic_latest is off; latest stays put until an operator promotes."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          gh workflow run release-tags.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f action=promote -f version="$VERSION"
          echo "Requested promotion of $VERSION. It queues behind this run on the shared release lock,"
          echo "so it starts only once these frozen resources have landed on main."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            output/
            reports/plugin-verification.json
            reports/build-dependencies.json
            reports/live-gaps.json
            reports/epg-gaps.json
            cdn-verification.json
