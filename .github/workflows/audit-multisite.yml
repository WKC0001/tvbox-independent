name: audit-multisite-registry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m checker.audit --network github --mode full --workers 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multisite-network-audit
          path: |
            state/provider-audit.json
            state/multisite-health.json
            reports/audit-github.json
