name: maintenance-check
on:
  schedule:
    - cron: '7 */2 * * *'
    - cron: '17 19 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [light, full, weekly]
        default: light
permissions:
  contents: write
  actions: write
concurrency:
  group: independent-release-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE";
          elif [ "$SCHEDULE" = '7 */2 * * *' ]; then
            # 每两小时一轮轻量探测。UTC 22 与 10 点正是北京 06 与 18 点，
            # 这两轮升级为全量（含线路身份核验）——早晚各一次完整更新。
            # 分档放在这里而不是多写两条 cron：`*/2` 本来就覆盖这两个小时，
            # 再加 cron 会在同一分钟触发两个 run。
            HOUR="$(date -u +%H)"
            if [ "$HOUR" = '22' ] || [ "$HOUR" = '10' ]; then MODE=full; else MODE=light; fi
          else MODE=full; fi
          if [ "$MODE" = weekly ]; then MODE=full; fi
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$SCHEDULE" = '17 19 * * 5' ] || [ "$INPUT_MODE" = 'weekly' ]; then
            echo "epg=true" >> "$GITHUB_OUTPUT"
          else
            echo "epg=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update network-specific health before ranking
        run: python -m checker.audit --network github --mode '${{ steps.mode.outputs.value }}' --workers 20
      - name: Re-measure how fast each provider answers the home screen
        # 首页是"先答者优先"，并发之后首屏耗时就等于排在第一位那家的耗时，
        # 所以排序键必须定期重测。这里测的是首页真正调用的接口（ac=detail），
        # 不是审计里的 latency_ms（那个测的是 ac=list，两者实测不相关）。
        # Best-effort：一次测不到不会删掉上次的结论，只是那一家保持原排序。
        continue-on-error: true
        run: python scripts/measure_home_latency.py --samples 2 --workers 4
      - name: Re-confirm television guide ids against the programme source
        if: steps.mode.outputs.epg == 'true'
        # The source throttles bulk querying, so each run re-verifies one slice of the registry and
        # resumes from the cursor next time. The matcher keeps a working mapping whenever the source
        # cannot answer, so an outage never erases verified data; best-effort keeps health landing.
        continue-on-error: true
        run: python scripts/epg_match.py --workers 3 --window 160
      - name: Hold every ad verdict to its frame-scan evidence
        # An `ad_scan` of clean moves a provider ahead of the ones nobody has scanned, so it is a
        # claim about the picture the user is about to see. Three shipped providers were carrying
        # "clean" with no scan record anywhere; this demotes any such verdict back to pending.
        run: python scripts/verify_ad_evidence.py
      - name: Verify every live route answers with the channel it claims
        if: steps.mode.outputs.value == 'full'
        # A source can answer a request for one channel with an advertisement loop, and that stream
        # is valid HLS, so reachability and latency ranking cannot tell it apart. Only identity can,
        # and with the fastest source winning the ranking an ad source will otherwise outrank the
        # real one. Best-effort: an unreachable source must never stop health evidence from landing.
        continue-on-error: true
        run: python scripts/verify_live_identity.py --workers 12 --apply
      - name: Save audit evidence without deleting channel identities
        id: evidence
        if: always()
        run: |
          git config user.name maintenance-bot
          git config user.email actions@users.noreply.github.com
          git add state/provider-audit.json state/multisite-health.json reports/audit-github.json \
                  registry/channels.json reports/epg-match.json state/epg-cursor.json \
                  registry/routes.json reports/live-identity.json state/home-latency.json \
                  registry/sites.json reports/ad-evidence.json
          # Re-confirming a mapping rewrites the time it was confirmed. That renews real evidence and
          # is worth committing, but it ships a byte-identical release, so only a change in what users
          # receive (or in health evidence) may open a new candidate.
          guide_now="$(python scripts/guide_signature.py)"
          guide_head="$(git show HEAD:registry/channels.json | python scripts/guide_signature.py -)"
          health=no
          git diff --cached --quiet -- state/provider-audit.json state/multisite-health.json reports/audit-github.json || health=yes
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to record."
          else
            git commit -m 'chore: refresh independent health and guide evidence [skip ci]'
            git push
            if [ "$guide_now" = "$guide_head" ] && [ "$health" = no ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Only evidence timestamps moved; no new candidate is warranted."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Prepare a fresh fixed-version candidate after full checks
        if: success() && steps.mode.outputs.value == 'full' && steps.evidence.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys;sys.exit(0 if json.load(open('policy/operations.json'))['automatic_candidates'] else 1)"; then
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f bump=true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-evidence
          path: reports/audit-github.json
