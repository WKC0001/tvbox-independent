name: promote-or-rollback-verified-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact verified npm version
        required: true
      action:
        type: choice
        options: [promote, rollback]
        default: promote
permissions:
  contents: read
concurrency:
  group: independent-release-state
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - name: Check the acceptance record frozen with this version
        id: recorded
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/check_acceptance.py
      - name: Produce acceptance evidence when the version carries none
        if: steps.recorded.outcome != 'success'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/auto_acceptance.py
      - name: Check recorded machine acceptance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/check_acceptance.py
      - name: Move latest to the accepted fixed release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm dist-tag add "wkc0001-tvbox-independent@$RELEASE_VERSION" latest
      - name: Refresh the CDN alias and report what it resolves to
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 两个入口都要清：npm 的版本别名（实测推进 latest 后十几分钟仍返回上一版，
          # purge 也清不掉），和仓库分支路径（主入口，提交后即为新内容）。
          for path in "npm/wkc0001-tvbox-independent@latest/dc.json" \
                      "gh/WKC0001/tvbox-independent@main/output/dc.json" \
                      "gh/WKC0001/tvbox-independent@main/output/api.json"; do
            curl --silent --fail --max-time 30 "https://purge.jsdelivr.net/$path" > /dev/null || true
          done
          # 以主入口为准报告解析结果，而不是假定它已经生效。
          SEEN=unknown
          for attempt in 1 2 3 4 5 6; do
            SEEN="$(curl --silent --max-time 30 \
              https://cdn.jsdelivr.net/gh/WKC0001/tvbox-independent@main/output/manifest.json \
              | python -c "import json,sys;print(json.load(sys.stdin).get('version','unknown'))" \
              2>/dev/null || echo unknown)"
            echo "attempt $attempt: @latest resolves to $SEEN (wanted $RELEASE_VERSION)"
            [ "$SEEN" = "$RELEASE_VERSION" ] && break
            sleep 30
          done
          if [ "$SEEN" != "$RELEASE_VERSION" ]; then
            echo "::warning::@latest still resolves to $SEEN. The fixed URL @$RELEASE_VERSION is already live and can be used until the alias catches up."
          fi
