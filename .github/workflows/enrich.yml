name: audit-and-enrich
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Audit original and test candidates
        run: python3 scripts/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrichment-probes
          path: probe-output/
