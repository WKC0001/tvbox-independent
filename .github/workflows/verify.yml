name: verify-independent-distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for npm processing and verify complete CDN distribution
        run: node scripts/verify-cdn.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdn-verification
          path: cdn-verification.json
