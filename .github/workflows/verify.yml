name: verify-independent-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-cdn.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: cdn-verification.json
