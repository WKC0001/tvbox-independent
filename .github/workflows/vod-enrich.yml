name: enrich-specialized-vod
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py
        env:
          VOD_ONLY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vod-enrichment
          path: probe-output/
