name: publish-independent-npm
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: publish-independent
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Android compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar --output java/json.jar
          if [ ! -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
          fi
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"
          echo "D8_JAR=$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar" >> "$GITHUB_ENV"
      - name: Build and test the shipped Android plugin and final package
        run: python3 scripts/build_release.py
      - name: Pack the final release
        run: npm pack --ignore-scripts
      - name: "Publish candidate package with next tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")" --ignore-scripts --registry=https://registry.npmjs.org/ --access public --tag next
      - name: Verify registry and CDN
        run: node scripts/verify-cdn.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            cdn-verification.json
            home-integration.json
            build-verification.json
